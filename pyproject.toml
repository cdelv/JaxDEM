[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "JaxDEM"
version = "0.1.0"
description = "Easy to use and blazing fast JAX-based library for high-performance 2D/3D Discrete Element Method (DEM) simulations."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  {name = "Carlos Andres del Valle", email = "carlos.delvalleurberuaga@yale.edu"},
  {name = "Marshall McCraw", email = "marshall.mccraw@yale.edu"},
]
keywords = [
    "dem",
    "discrete-element-method",
    "jax",
    "physics",
    "simulation",
    "granular",
    "differentiable-physics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

dependencies = [
    "jax>=0.8.1",
    "numpy",
    "scipy",
    "optax>=0.2.8",
]

[project.urls]
Homepage = "https://cdelv.github.io/JaxDEM"
Documentation = "https://cdelv.github.io/JaxDEM"
Repository = "https://github.com/cdelv/JaxDEM"
Issues = "https://github.com/cdelv/JaxDEM/issues"

[project.optional-dependencies]
io = ["vtk", "h5py", "orbax-checkpoint>=0.12.1"]
rl = [
    "flax>=0.12.0",
    "distrax",
    "tqdm",
    "tensorboard",
    "tensorboardX>=2.6",
]
puffer = [
    "JaxDEM[rl]",
    "pufferlib>=4.0",
]

docs = [
    "JaxDEM[io,rl]",
    "matplotlib",
    "sphinx==9.1.0",
    "myst-parser==5.1.0",
    "pydata-sphinx-theme==0.20.0",
    "sphinx-gallery==0.21.0",
]
test = ["JaxDEM[io,rl]", "pytest>=8", "mypy>=1.19", "build>=1.2"]

all = ["JaxDEM[io,rl]"]
dev = ["JaxDEM[io,rl,docs,test]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jaxdem", "jaxdem.*"]

[tool.setuptools.package-data]
jaxdem = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
warn_return_any = false
ignore_missing_imports = true
python_version = "3.12"
disallow_untyped_decorators = false
exclude = ["docs", "tests"]
warn_unused_configs = true
warn_unused_ignores = false
warn_redundant_casts = true
warn_unreachable = true
