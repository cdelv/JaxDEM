[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "JaxDEM"
version = "0.1"
description = "Easy to use and blazing fast JAX-based library for high-performance 2D/3D Discrete Element Method (DEM) simulations."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "BSD-3-Clause"}
authors = [
  {name = "Carlos Andres del Valle", email = "carlos.delvalleurberuaga@yale.edu"},
  {name = "Marshall McCraw", email = "marshall.mccraw@yale.edu"},
]
urls = {Repository = "https://github.com/cdelv/JaxDEM"}

dependencies = [
    "jax>=0.8.1",
    "numpy",
    "optax>=0.2.6",
]

[project.optional-dependencies]
io = ["vtk", "h5py", "orbax-checkpoint>=0.12.1"]
rl = [
    "flax>=0.12.0",
    "distrax",
    "tqdm",
    "scipy",
    "tensorboard",
    "tensorboardX>=2.6",
]

docs = [
    "JaxDEM[io,rl]",
    "sphinx==9.1.0",
    "myst-parser==5.1.0",
    "pydata-sphinx-theme==0.20.0",
    "sphinx-gallery==0.21.0",
]
test = ["JaxDEM[io,rl]", "pytest>=8", "mypy>=1.19", "build>=1.2"]

all = ["JaxDEM[io,rl,docs,test]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jaxdem", "jaxdem.*"]

[tool.setuptools.package-data]
jaxdem = ["py.typed"]

[tool.mypy]
strict = true
warn_return_any = false
ignore_missing_imports = true
python_version = "3.12"
disallow_untyped_decorators = false
exclude = ["docs", "tests"]
warn_unused_configs = true
warn_unused_ignores = false
warn_redundant_casts = true
warn_unreachable = true
