name: Core regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        x64: ['0', '1']
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: ${{ matrix.x64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install library and test tools
        run: python -m pip install . pytest
      - name: Check boundary and force contracts
        run: >-
          python -m pytest -q
          tests/test_boundary_search_geometry.py
          tests/test_neighbor_list_lifecycle.py
          tests/test_construction_contracts.py
          tests/test_force_search_contracts.py
          tests/test_force_cutoffs.py
          tests/test_step_layout.py
          tests/test_initialization.py
          tests/test_benchmark_contracts.py
          tests/test_minimizer_contracts.py
      - name: Check checkpoint protocols
        run: python -m pytest -q tests/test_checkpoints.py
      - name: Check priority normalization
        run: python -m pytest -q tests/test_ppo_math.py -k priority_probabilities
